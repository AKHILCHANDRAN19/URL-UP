# ===============================================================
# Render Blueprint for the URL Uploader Bot (CORRECTED)
# ===============================================================
services:
- name: url-uploader-bot
  type: web
  env: python
  plan: free
  region: frankfurt

  buildCommand: |
    apt-get update && apt-get install -y aria2 && pip install -r requirements.txt
  
  startCommand: python bot.py

  healthCheckPath: /health
  autoDeploy: true
  branch: main

  envVars:
  - key: API_ID
    value: "2819362"
  - key: API_HASH
    value: "578ce3d09fadd539544a327c45b55ee4"
  - key: BOT_TOKEN
    value: "8390475015:AAF8dauJYTWFwktTQABzG17_-JTN4r71R3M"
  
  # --- CORRECTED DISK PATH ---
  # This mounts the disk as a 'data' folder inside your project directory.
  disk:
    name: bot-data
    mountPath: ./data  # <-- THE CRITICAL FIX IS HERE
    sizeGB: 1
