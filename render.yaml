# ===============================================================
# Render Blueprint for URL Uploader Bot (DOCKER - FINAL FIX)
# ===============================================================
services:
- name: url-uploader-bot
  type: web
  env: docker  # <-- CRITICAL CHANGE: Tell Render to use Docker
  plan: free
  region: frankfurt

  # Health check path remains the same
  healthCheckPath: /health
  
  # Auto-deploy on push to the main branch
  autoDeploy: true
  branch: main

  # Your environment variables
  envVars:
  - key: API_ID
    value: "2819362"
  - key: API_HASH
    value: "578ce3d09fadd539544a327c45b55ee4"
  - key: BOT_TOKEN
    value: "8390475015:AAF8dauJYTWFwktTQABzG17_-JTN4r71R3M"
  
  # --- Persistent Disk ---
  # The mount path is now an absolute path inside the Docker container's filesystem
  disk:
    name: bot-data
    mountPath: /app/data
    sizeGB: 1
